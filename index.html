<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvE Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a:#8B5CF6;--a2:#6D28D9;--rim:#C4B5FD;--bg:#07080a;--g:rgba(255,255,255,.055);--b:rgba(255,255,255,.09);--t:#f2f2f0;--m:#8b8d93}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);overflow:hidden;-webkit-tap-highlight-color:transparent;
font-family:Inter,-apple-system,"SF Pro Display","Noto Sans Thai",Sarabun,"Thonburi",system-ui,sans-serif;font-size:34px;line-height:1.4}
body{background:radial-gradient(900px 900px at 28% 55%,rgba(139,92,246,.10),transparent 65%),var(--bg);transition:filter 2s}
body.dim{filter:brightness(.35)}
.glass{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
header{position:fixed;top:0;left:0;right:0;height:150px;padding:40px 56px;display:flex;align-items:flex-start;justify-content:space-between;z-index:5}
.status{display:flex;align-items:center;gap:12px;color:var(--m);font-size:24px;margin-top:8px}
.dot{width:16px;height:16px;border-radius:50%;background:#c44;box-shadow:0 0 12px #c44}
.dot.on{background:var(--a);box-shadow:0 0 16px var(--a)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.clock{border-radius:28px;padding:18px 30px;display:flex;align-items:baseline;gap:22px}
.time{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--m);font-size:26px}
/* stage */
#stage{position:fixed;inset:150px 56px 130px 56px;display:grid;grid-template-columns:var(--hero,720px) 1fr;gap:56px;align-items:center;transition:grid-template-columns .6s}
body.m-q{--hero:640px}body.m-msg{--hero:500px}
.slot{width:100%;aspect-ratio:1;max-height:100%}
#panel{min-width:0;max-height:100%;overflow:hidden;position:relative;z-index:2}
#eve{position:fixed;left:0;top:0;width:100px;height:100px;z-index:3;pointer-events:none;will-change:transform;transform-origin:50% 100%;transition:filter .8s,opacity .8s}
#eve img{width:100%;height:100%;display:block;filter:drop-shadow(0 0 60px rgba(139,92,246,.35))}
#eve.sleep{opacity:.45;filter:grayscale(1)}
#eve.perk img{filter:drop-shadow(0 0 110px rgba(139,92,246,.9))}
.bub{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(139,92,246,.4);border-radius:48px;padding:56px 64px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 30px 90px rgba(0,0,0,.5)}

.kind{color:var(--a);font-size:28px;font-weight:700;letter-spacing:3px}
.greet{font-size:96px;font-weight:800;line-height:1.12}
.greet small{display:block;color:#cfcfcf;font-size:52px;font-weight:600;margin-top:22px;line-height:1.25}
.q{font-size:72px;font-weight:800;line-height:1.18;margin:16px 0 40px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.opt{min-height:120px;padding:18px 26px;border-radius:32px;border:2px solid rgba(139,92,246,.6);background:rgba(139,92,246,.08);color:var(--t);
font:800 58px/1.1 Inter,-apple-system,"SF Pro Display","Noto Sans Thai",system-ui,sans-serif;cursor:pointer;font-variant-numeric:tabular-nums}
.opt:active,.opt.sel{background:var(--a);color:#111;border-color:var(--a);box-shadow:0 0 50px rgba(139,92,246,.5)}
.opt:disabled{opacity:.3}.opt.sel:disabled{opacity:1}
.conf{margin-top:32px;font-size:42px;font-weight:800;color:var(--a)}
.err{color:#ff7b7b;font-size:30px;margin-top:20px}
.title{font-size:88px;font-weight:800;line-height:1.12;margin:18px 0 28px}
.body{font-size:50px;white-space:pre-wrap;color:#ddd;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.ago{color:var(--m);font-size:26px;margin-top:28px}
.fl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:10px 0 30px}
.ap{font-size:140px;font-weight:800;line-height:1}.ap.r{text-align:right}
.arr{color:var(--a);font-size:80px;padding:0 26px}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tm div{font-size:28px;color:var(--m)}.tm b{display:block;font-size:92px;color:var(--t);font-variant-numeric:tabular-nums}
.tm div:last-child{text-align:right}
/* history strip */
#hist{position:fixed;left:56px;right:56px;bottom:36px;height:70px;border-radius:24px;display:flex;align-items:center;gap:40px;padding:0 30px;overflow:hidden;white-space:nowrap;z-index:4;transition:opacity .6s}
body.m-idle #hist{opacity:0}
#hist h3{color:var(--m);font-size:22px;letter-spacing:3px;font-weight:600}
.hi{font-size:26px;overflow:hidden;text-overflow:ellipsis;max-width:520px;color:#ccc}
.hi small{color:var(--a);font-size:20px;margin-right:10px}
.hdl{display:flex;align-items:flex-start;gap:28px}
.loc{min-height:64px;margin-top:2px;padding:0 28px;border-radius:32px;display:flex;align-items:center;gap:14px;color:var(--t);font:700 26px/1 Inter,-apple-system,"Noto Sans Thai",system-ui,sans-serif;cursor:pointer}
.loc .ld{width:14px;height:14px;border-radius:50%;background:var(--m)}
.loc.on .ld{background:var(--a);box-shadow:0 0 14px var(--a)}.loc.on{border-color:rgba(139,92,246,.5)}
.loc.err{color:#ff9b9b}.loc.err .ld{background:#c44}
/* ===== responsive overrides ===== */
:root{--px:clamp(20px,2.9vw,56px);--hh:clamp(96px,11vh,150px);--hb:clamp(96px,10.8vh,130px)}
*{word-break:normal;overflow-wrap:break-word;line-break:auto}
header{height:var(--hh);padding:0 var(--px);align-items:center;justify-content:flex-start;gap:clamp(14px,1.6vw,28px);white-space:nowrap;flex-wrap:nowrap}
header>*{flex:none}.sp{flex:1 1 0;min-width:0}
.status{margin:0;font-size:clamp(18px,1.25vw,24px)}
.loc{margin:0;font-size:clamp(20px,1.4vw,26px);padding:0 clamp(18px,1.5vw,28px)}
.clock{padding:clamp(10px,1vh,18px) clamp(18px,1.6vw,30px);gap:clamp(12px,1.1vw,22px);white-space:nowrap}
.time{font-size:clamp(34px,3.3vw,64px)}.date{font-size:clamp(17px,1.35vw,26px)}
#stage{inset:var(--hh) var(--px) var(--hb) var(--px);gap:clamp(28px,2.9vw,56px);--hero:min(720px,60vh,40vw)}
body.m-q #stage{--hero:min(640px,52vh,34vw)}body.m-msg #stage{--hero:min(500px,42vh,30vw)}
#stage{grid-template-columns:var(--hero) minmax(0,1fr)}
.slot{width:var(--hero);height:var(--hero);max-height:none;aspect-ratio:auto}
.bub{padding:clamp(28px,4vh,56px) clamp(30px,3.4vw,64px);border-radius:clamp(30px,3vw,48px)}
.kind{font-size:clamp(18px,1.5vw,28px)}
.greet{font-size:clamp(40px,min(5vw,8vh),96px)}.greet small{font-size:clamp(24px,min(2.7vw,4.4vh),52px);margin-top:clamp(10px,1.8vh,22px)}
.q{font-size:clamp(34px,min(3.8vw,6vh),72px);margin:clamp(8px,1.3vh,16px) 0 clamp(20px,3.3vh,40px)}
.opts{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:clamp(12px,1.3vw,24px)}
.opt{min-height:clamp(72px,10vh,120px);font-size:clamp(30px,min(3vw,4.8vh),58px);white-space:nowrap}
.conf{font-size:clamp(24px,min(2.2vw,3.5vh),42px);margin-top:clamp(16px,2.7vh,32px)}
.title{font-size:clamp(38px,min(4.6vw,7.4vh),88px);margin:clamp(8px,1.5vh,18px) 0 clamp(12px,2.3vh,28px)}
.body{font-size:clamp(26px,min(2.6vw,4.2vh),50px);-webkit-line-clamp:6}
.ago{font-size:clamp(18px,1.35vw,26px);margin-top:clamp(12px,2.3vh,28px)}
.ap{font-size:clamp(60px,min(7.3vw,11.5vh),140px)}.arr{font-size:clamp(40px,min(4.2vw,6.6vh),80px);padding:0 clamp(12px,1.4vw,26px)}
.tm div{font-size:clamp(18px,1.45vw,28px)}.tm b{font-size:clamp(44px,min(4.8vw,7.6vh),92px)}
#hist{left:var(--px);right:var(--px);bottom:clamp(16px,3vh,36px);height:clamp(54px,5.8vh,70px);gap:clamp(18px,2vw,40px)}
.hi{font-size:clamp(18px,1.35vw,26px);max-width:min(520px,40vw)}
/* stacked layout for near-square viewports (Tesla half screen ~1100x900) */
@media (max-aspect-ratio:7/5){
 #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--heroH) minmax(0,1fr);align-items:start;justify-items:stretch;--heroH:min(40vh,46vw);gap:clamp(18px,2.4vh,32px)}
 body.m-q #stage{--heroH:min(23vh,30vw)}body.m-msg #stage{--heroH:min(22vh,28vw)}
 .slot{width:var(--heroH);height:var(--heroH);justify-self:center}
 body.m-msg .slot{justify-self:start}
 #panel{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-start}
 body.m-idle #panel{justify-content:flex-start;align-items:center}
 
 .greet{text-align:center;font-size:clamp(40px,min(6vw,7.4vh),96px)}
 .q{font-size:clamp(34px,min(4.6vw,5.6vh),72px)}
 .title{font-size:clamp(38px,min(5.6vw,6.6vh),88px)}
 .body{font-size:clamp(26px,min(3.2vw,3.9vh),50px)}
 .hi{max-width:min(420px,44vw)}
}
@media (max-width:1040px){.date{display:none}}
.title,.q,.greet{text-wrap:balance}
/* ===== talk to EvE ===== */
#stage{z-index:4}
.slot{position:relative}



#mouth{position:absolute;left:50%;top:63%;width:13%;height:7%;border-radius:50%;background:#111114;transform:translate(-50%,-50%) scaleY(.15);opacity:0;transition:opacity .2s}
body.speaking #mouth{opacity:1}
.spk{min-height:64px;min-width:64px;border-radius:32px;color:var(--t);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spk.off{color:var(--m)}
.said{font-size:clamp(34px,min(3.8vw,6vh),68px);font-weight:800;line-height:1.2;margin-top:12px}
.said.ph{color:var(--m)}
.dots span{display:inline-block;width:.32em;height:.32em;margin:0 .12em;border-radius:50%;background:var(--a);animation:dt 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-.25em)}}
.vsub{color:var(--m);font-size:clamp(20px,1.6vw,30px);margin-top:18px}
body.m-v #stage{--hero:min(640px,52vh,34vw)}
@media (max-aspect-ratio:7/5){
 body.m-v #stage{--heroH:min(23vh,30vw)}
}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}

/* ===== purple aura + mic variants ===== */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.clock{align-items:center}
.clock .dot{width:10px;height:10px;flex:none;align-self:center;box-shadow:0 0 8px #c44}
.clock .dot.on{background:var(--a);box-shadow:0 0 10px var(--a)}
#eve img{filter:none;position:relative;z-index:1}
#eve.perk img{filter:none}
#eve.perk #aura,body.listening #aura{opacity:1;filter:brightness(1.35);animation-duration:1.4s}
#aura{position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.55) 0%,rgba(109,40,217,.20) 45%,transparent 70%);animation:aura 3s ease-in-out infinite;pointer-events:none}
#aura:after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px solid rgba(196,181,253,.35)}
@keyframes aura{0%,100%{opacity:.7}50%{opacity:1}}
#eve.sleep #aura{animation-play-state:paused;opacity:.5}
#trace{position:absolute;inset:-4%;width:108%;height:108%;opacity:0;pointer-events:none;overflow:visible}
#trace circle{fill:none;stroke:var(--a);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:28 72;filter:drop-shadow(0 0 2px var(--a))}
body.mic-c.listening #trace{opacity:1;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* C blob is the button */
.micbadge{display:none}
.micbadge .ic-stop{display:none}body.listening .micbadge .ic-stop{display:block}body.listening .micbadge .ic-mic{display:none}
body.mic-c .slot{cursor:pointer}
body.mic-c .micbadge{display:flex;position:absolute;right:6%;bottom:6%;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 20px rgba(139,92,246,.5);z-index:5;cursor:pointer;padding:0}
body.mic-c .micbadge svg{width:28px;height:28px}
body.mic-c.listening .micbadge{box-shadow:0 0 0 4px rgba(196,181,253,.35),0 0 30px rgba(139,92,246,.8)}
@media (prefers-reduced-motion:reduce){#aura,#trace{animation:none!important}}
.ico{width:1.1em;height:1.1em;flex:none;display:inline-block;vertical-align:-.15em}
.spk{width:64px;padding:0;color:#fff;border-color:rgba(139,92,246,.5);box-shadow:0 0 0 1px rgba(139,92,246,.25),0 0 14px rgba(139,92,246,.25);transition:opacity .3s,box-shadow .3s,border-color .3s}
.spk .ico{width:30px;height:30px}
.spk.off{color:#fff;opacity:.5;border-color:var(--b);box-shadow:none}
.loc .ico{width:26px;height:26px;margin-left:-4px}
.arr .ico{width:.8em;height:.8em;vertical-align:middle}
.gear{border-color:var(--b);box-shadow:none}.gear[aria-expanded="true"]{border-color:rgba(139,92,246,.6);box-shadow:0 0 14px rgba(139,92,246,.3)}
#vset{position:fixed;top:calc(var(--hh) - 10px);left:var(--px);z-index:8;width:min(520px,calc(100vw - 2*var(--px)));padding:28px 32px;border-radius:32px;border-color:rgba(139,92,246,.45);background:rgba(20,18,28,.94);box-shadow:0 30px 90px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:22px;font-size:24px}
#vset[hidden]{display:none}
.vs-h{font-weight:800;font-size:28px;color:var(--a);letter-spacing:1px}
#vset label{display:flex;flex-direction:column;gap:12px;color:#ccc;font-weight:600}
#vset label b{color:#fff;font-variant-numeric:tabular-nums;position:absolute;right:32px;margin-top:0}
#vset label{position:relative}
#vsVoice{font:600 22px/1.2 Inter,"Noto Sans Thai",system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(139,92,246,.45);border-radius:18px;padding:14px 18px;appearance:none;-webkit-appearance:none}
#vsVoice option{background:#1b1a22}
#vset input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.15);accent-color:#8B5CF6}
#vset input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#8B5CF6;border:3px solid #fff;box-shadow:0 0 14px rgba(139,92,246,.6)}
.vs-test{min-height:68px;border-radius:34px;border:1px solid rgba(139,92,246,.6);background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;font:800 24px/1 Inter,"Noto Sans Thai",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.vs-test .ico{width:26px;height:26px}
.vs-src{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid var(--b)}
.vs-src button{min-height:56px;border-radius:18px;border:0;background:transparent;color:#bbb;font:700 21px/1 Inter,"Noto Sans Thai",system-ui,sans-serif;cursor:pointer}
.vs-src button[aria-checked="true"]{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff}
.vs-src button:disabled{opacity:.35}
#vsOA,#vsVoice{font:600 22px/1.2 Inter,"Noto Sans Thai",system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(139,92,246,.45);border-radius:18px;padding:14px 18px;appearance:none;-webkit-appearance:none}
#vsOA option{background:#1b1a22}
#vset .hid{display:none}
.tapl{margin-top:22px;display:inline-flex;align-self:flex-start;width:auto;align-items:center;gap:10px;min-height:56px;padding:0 26px;border-radius:28px;border:0;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;font:800 22px/1 Inter,"Noto Sans Thai",system-ui,sans-serif;cursor:pointer;box-shadow:0 0 24px rgba(139,92,246,.45)}.tapl .ico{width:22px;height:22px}
#alert{display:none;align-items:center;gap:20px;text-align:left;width:100%;margin:0 0 clamp(14px,2vh,22px);padding:22px 28px;border-radius:28px;border:1px solid rgba(139,92,246,.5);background:rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:inherit;transform:translateY(-16px);opacity:0}
#alert.in{display:flex;animation:ain .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ain{to{transform:none;opacity:1}}
body.m-idle.has-alert #pmain,body.has-agenda #pmain,body.has-agenda #alert{display:none}
#agenda{display:none;align-items:flex-start;gap:20px;text-align:left;width:100%;padding:18px 28px;border-radius:28px;border:1px solid rgba(139,92,246,.5);background:rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:inherit;transform:translateY(-16px);opacity:0}
@media (max-aspect-ratio:7/5){body.has-agenda #stage{--heroH:min(26vh,32vw)}}
#agenda.in{display:flex;animation:ain .5s cubic-bezier(.2,.8,.2,1) forwards}
#agenda .ai{color:#8B5CF6;display:flex;flex:none;padding-top:2px}#agenda .ai svg{width:38px;height:38px}
.ag{flex:1;min-width:0}.ag .at{font-size:28px;font-weight:800;margin-bottom:6px}
.ar{display:grid;grid-template-columns:82px 1fr;column-gap:16px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.ar b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.ar span{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar small{grid-column:2;font-size:16px;color:#8A8A93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amore{font-size:16px;color:#C4B5FD;font-weight:700;padding-top:8px}
#agenda .ad{font-size:22px;color:#8A8A93}
#alert.cal .ai svg{width:38px;height:38px}
#alert .ai{color:#8B5CF6;display:flex;flex:none}#alert .ai svg{width:40px;height:40px}
#alert .at{font-size:28px;font-weight:800;line-height:1.2}
#alert .ad{font-size:16px;color:#8A8A93;margin-top:6px}
@media (prefers-reduced-motion:reduce){#alert.in{animation:none;transform:none;opacity:1}}
/* ===== strip mode: short pane (Tesla browser shrunk above the map) ===== */
.amore-s{display:none}
@media (max-height:360px),(min-aspect-ratio:4/1){
 body{background:var(--bg)}
 body:before{content:"";position:fixed;inset:8px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:none}
 header{top:0;bottom:0;left:auto;right:0;height:auto;padding:0 calc(var(--px) + 6px) 0 0;gap:12px}
 header .sp,.date,#locT{display:none}
 .loc{min-height:56px;padding:0 16px}.spk{min-height:56px;width:56px;min-width:56px}
 .clock{padding:10px 18px}.time{font-size:40px}
 #stage{inset:16px 490px 16px calc(var(--px) + 6px);display:grid;grid-template-columns:var(--sh) minmax(0,1fr);grid-template-rows:none;gap:28px;align-items:center;--sh:min(calc(100vh - 56px),190px)}
 body .slot{width:var(--sh);height:var(--sh);justify-self:start;align-self:center}
 body.mic-c .micbadge{width:44px;height:44px;right:2%;bottom:2%}body.mic-c .micbadge svg{width:22px;height:22px}
 #panel{align-self:center;display:flex;flex-direction:column;justify-content:center;max-height:100%}
 body.m-idle #panel{align-items:stretch}
 #hist{display:none}
 .bub{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}

<script>
const k=new URLSearchParams(location.search).get('k')||'';const KQ=k?'?k='+encodeURIComponent(k):'';

let TTS={enabled:false,voices:[],voice:''},player=null;
fetch('/api/tts/status'+KQ,{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(d=>{if(d){TTS=d;if(!VS.oa)VS.oa=d.voice}fillOA()}).catch(()=>{}).finally(fillOA);
function fillOA(){const s=$('vsOA');s.innerHTML=(TTS.voices||[]).map(v=>`<option value="${v}"${v===(VS.oa||TTS.voice)?' selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('');srcUI()}
function useOA(){return VS.src==='openai'&&TTS.enabled}
function srcUI(){const oa=useOA();$('srcOA').disabled=!TTS.enabled;$('srcOA').setAttribute('aria-checked',oa);$('srcBR').setAttribute('aria-checked',!oa);$('vsOAw').classList.toggle('hid',!oa);$('vsVoiceW').classList.toggle('hid',oa);$('vsPitch').parentNode.classList.toggle('hid',oa)}
let speakQ=[],playing=false,tapText='';
function stopAudio(){speakQ=[];playing=false;try{AU.pause()}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();if(vmode==='speak')setV('')}
function spoke(){playing=false;if(vmode==='speak')setV('');setTimeout(drainQ,150)}
function drainQ(){if(playing||listening||!speakQ.length)return;const t=speakQ.shift();playing=true;useOA()?speakOA(t):speakBR(t)}
function addTap(){const bub=document.querySelector('#pmain .bub')||$('pmain');if(!tapText||!bub||bub.querySelector('.tapl'))return;
 const b=document.createElement('button');b.className='tapl';b.innerHTML=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"/></svg>แตะเพื่อฟัง`;
 b.onclick=e=>{e.stopPropagation();const t=tapText;tapText='';b.remove();unlock();speakQ.unshift(t);playing=false;drainQ()};bub.appendChild(b)}
function speakOA(text){setV('speak');const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);
 fetch('/api/tts'+KQ,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',signal:ac.signal,body:JSON.stringify({text,voice:VS.oa||undefined,speed:+VS.rate||1})})
  .then(r=>{if(r.status===501)TTS.enabled=false;if(!r.ok)throw new Error('tts http '+r.status);return r.blob()})
  .then(bl=>{clearTimeout(to);const url=URL.createObjectURL(bl);let fin=false;const done=()=>{if(fin)return;fin=true;URL.revokeObjectURL(url);AU.onended=AU.onerror=null;spoke()};
   AU.onended=done;AU.onerror=()=>{console.log('[EvE] audio element error');fin=true;URL.revokeObjectURL(url);speakBR(text)};
   AU.src=url;const pr=AU.play();window.__eveLastPlay={text,at:Date.now()};
   return pr&&pr.catch(e=>{AU.onended=AU.onerror=null;console.log('[EvE] play() rejected:',e&&e.name,e&&e.message);fin=true;URL.revokeObjectURL(url);if(e&&e.name==='NotAllowedError'){tapText=text;addTap()}speakBR(text)})})
  .catch(e=>{clearTimeout(to);console.log('[EvE] OpenAI TTS failed, using browser voice:',e&&e.name==='AbortError'?'timeout 12s':e&&e.message);speakBR(text)})}
function say(it,force){if(!spkOn&&!force)return;const text=[it.title,it.body].filter(Boolean).join('. ');if(!text)return;
 if(force){stopAudio()}speakQ.push(text);drainQ()}
function speakBR(text){playing=true;if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){console.log('[EvE] no speechSynthesis');spoke();return}
 try{const u=new SpeechSynthesisUtterance(text);const v=thVoice();u.lang=v?v.lang:'th-TH';if(v)u.voice=v;u.rate=+VS.rate||1;u.pitch=+VS.pitch||1;
  let fin=false;const done=ev=>{if(fin)return;fin=true;if(ev&&ev.error)console.log('[EvE] speechSynthesis error:',ev.error);spoke()};u.onstart=()=>setV('speak');u.onend=u.onerror=done;setV('speak');speechSynthesis.speak(u);setTimeout(()=>{if(!fin&&!speechSynthesis.speaking&&!speechSynthesis.pending)done()},Math.max(4000,text.length*250))}catch(e){console.log('[EvE] speechSynthesis threw',e);spoke()}}
if(window.speechSynthesis&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',fillVoices);
fillVoices();vsUI();

document.addEventListener('click',e=>{const p=$('vset');if(!p.hidden&&!p.contains(e.target)&&!e.target.closest('#gear')){p.hidden=true;$('gear').setAttribute('aria-expanded','false')}});
$('srcOA').addEventListener('click',()=>{VS.src='openai';saveVS();srcUI()});$('srcBR').addEventListener('click',()=>{VS.src='browser';saveVS();srcUI()});

$('vsTest').addEventListener('click',()=>{unlock();say({title:'สวัสดีค่ะ ฉันคือ EvE',body:'ขับขี่ปลอดภัยนะคะ'},true)});
function sendSay(text){text=String(text||'').trim();if(!text){setVoice({phase:'err',text:'',sub:'ไม่ได้ยินเลย ลองอีกครั้งนะ'});return Promise.resolve(false)}
 setVoice({phase:'think',text});
 return fetch('/api/say'+KQ,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({text})})
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>d.id).catch(()=>{setVoice({phase:'err',text,sub:'ส่งไม่สำเร็จ ลองอีกครั้งนะ'});return false})}
function sendAudio(blob){setVoice({phase:'think',text:'',sub:'ส่งเสียงให้ EvE แล้ว'});uploading=true;
 return fetch('/api/voice'+KQ,{method:'POST',headers:{'Content-Type':blob.type||'audio/webm'},credentials:'same-origin',body:blob})
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>d.id).catch(()=>{setVoice({phase:'err',text:'',sub:'ส่งเสียงไม่สำเร็จ'});return false}).finally(()=>{uploading=false})}
// silence detection (only runs while listening)
let wbuf=null;
// VAD: needs >= MIN_SPEECH_MS of voiced frames before a SILENCE_TAIL_MS pause may end the clip; hard cap MAX_REC_MS.
const MIN_SPEECH_MS=1200,SILENCE_TAIL_MS=1800,MAX_REC_MS=30000,NO_SPEECH_GIVEUP_MS=10000;
let speechMs=0,lastFrame=0,noise=.012,meterOn=false;
function meter(){if(!listening){meterOn=false;return}let rms=0;const now=Date.now(),dt=Math.min(100,now-(lastFrame||now));lastFrame=now;
 if(an){an.getByteTimeDomainData(wbuf);for(let i=0;i<wbuf.length;i++){const d=(wbuf[i]-128)/128;rms+=d*d}rms=Math.sqrt(rms/wbuf.length)}
 const thr=Math.max(.03,noise*3);
 lvl=lvl*.7+Math.min(1,rms*6)*.3;document.body.style.setProperty('--lv',lvl.toFixed(2));
 if(vmode==='speak'){lastLoud=now}else if(rms>thr){lastLoud=now;speechMs+=dt;if(speechMs>=250)gotSpeech=true}else noise=noise*.98+rms*.02; // adaptive floor (road noise)
 const enough=speechMs>=MIN_SPEECH_MS||(!!heard&&gotSpeech);
 if(enough&&now-lastLoud>SILENCE_TAIL_MS)return stopMic();
 if(now-startedAt>MAX_REC_MS)return stopMic();
 if(an&&!gotSpeech&&now-startedAt>NO_SPEECH_GIVEUP_MS)return stopMic();
 requestAnimationFrame(meter)}
function micUI(on){if(!on)setTimeout(drainQ,200);const l=on?'แตะเพื่อหยุด':'คุยกับ EvE';$('micC').setAttribute('aria-label',l)}
function cleanupStream(){try{srcN&&srcN.disconnect()}catch(e){}srcN=null;an=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}
function startRecorder(){if(!window.MediaRecorder||!micStream){setVoice({phase:'err',text:'',sub:'เบราว์เซอร์นี้ไม่รองรับการบันทึกเสียง'});listening=false;micUI(false);cleanupStream();return}
 usedFallback=true;const mt=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 const chunks=[];mr=new MediaRecorder(micStream,mt?{mimeType:mt,audioBitsPerSecond:32000}:{});
 mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=()=>{const b=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});mr=null;cleanupStream();if(b.size>2*1024*1024-1024)return setVoice({phase:'err',text:'',sub:'เสียงยาวเกินไป'});const voiced=!an0||gotSpeech;if(!b.size||!voiced)return setVoice({phase:'err',text:'',sub:'ไม่ได้ยินเลย ลองอีกครั้งนะ'});sendAudio(b)};const an0=!!an;
 mr.start(1000);setVoice({phase:'listen',text:'',sub:'กำลังอัดเสียง (สูงสุด 30 วินาที)'})}
let lastTap=0,uploading=false;
function startMic(){unlock();const now=Date.now();if(now-lastTap<700)return Promise.resolve(false);lastTap=now; // ghost double-taps on the car screen
 if(listening)return stopMic();
 if(uploading||(mr&&mr.state!=='inactive'))return Promise.resolve(false); // still finishing/uploading the last utterance: one utterance = one upload
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setVoice({phase:'err',text:'',sub:'ไม่รองรับไมโครโฟน'});return Promise.resolve(false)}
 stopAudio();
 listening=true;heard='';gotSpeech=false;speechMs=0;lastFrame=0;usedFallback=false;micUI(true);setVoice({phase:'listen',text:''});
 return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(st=>{
  if(!listening){st.getTracks().forEach(t=>t.stop());return false}
  micStream=st;startedAt=lastLoud=Date.now();
  try{const AC=window.AudioContext||window.webkitAudioContext;actx=actx||new AC();actx.resume&&actx.resume();srcN=actx.createMediaStreamSource(st);an=actx.createAnalyser();an.fftSize=512;wbuf=new Uint8Array(an.fftSize);srcN.connect(an)}catch(e){an=null}
  if(!meterOn){meterOn=true;requestAnimationFrame(meter)} // single meter loop (rapid taps used to stack rAF loops)
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||window.EVE_FORCE_REC){startRecorder();return true}
  try{rec=new SR();rec.lang='th-TH';rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1}catch(e){rec=null;startRecorder();return true}
  rec.onresult=ev=>{if(vmode==='speak')return;let fin='',tmp='';for(let i=0;i<ev.results.length;i++){const r=ev.results[i];(r.isFinal?(fin+=r[0].transcript):(tmp+=r[0].transcript))}
   heard=(fin+tmp).trim();gotSpeech=true;lastLoud=Date.now();if(voice&&voice.phase==='listen'){voice.text=heard;render()}};
  rec.onerror=ev=>{const r=rec;rec=null;try{r&&r.abort()}catch(e){}
   if(heard){listening=false;micUI(false);cleanupStream();sendSay(heard)}
   else if(listening&&ev.error!=='aborted'&&ev.error!=='no-speech')startRecorder(); // SR unavailable/offline -> record audio instead
   else{listening=false;micUI(false);cleanupStream();setVoice({phase:'err',text:'',sub:'ไม่ได้ยินเลย ลองอีกครั้งนะ'})}};
  rec.onend=()=>{if(!rec)return;rec=null;listening=false;micUI(false);cleanupStream();heard?sendSay(heard):setVoice({phase:'err',text:'',sub:'ไม่ได้ยินเลย ลองอีกครั้งนะ'})};
  rec.start();return true
 }).catch(err=>{listening=false;micUI(false);setVoice({phase:'err',text:'',sub:err&&err.name==='NotAllowedError'?'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน':'เปิดไมโครโฟนไม่ได้'});return false})}
function stopMic(){if(!listening)return;listening=false;micUI(false);lvl=0;
 if(rec){try{rec.stop()}catch(e){}}            // onend sends the text
 else if(mr&&mr.state!=='inactive'){mr.stop()}  // onstop uploads the audio
 else{cleanupStream();setVoice(null)}}
SL.addEventListener('click',()=>{if(document.body.classList.contains('mic-c'))startMic()});

/* ---------- hands-free wake word ("อีฟ") ----------
   Real keyword spotting only when the browser has SpeechRecognition. Otherwise an energy VAD ("ฟังเสียงพูด"):
   any sustained speech >= 0.6s starts a capture — it cannot tell "อีฟ" from other speech. */
const WK={on:LS('eveWake')==='1',eng:null,sr:null,stream:null,an:null,src:null,buf:null,raf:0,back:500,rt:null,cool:0,sess:null,hit:'',hitN:0,err:''};
const WSR=window.SpeechRecognition||window.webkitSpeechRecognition;
const WAKE_RE=/(อีฟ|อี๊ฟ|hey\s*eve|\beve\b|เฮ้\s*อีฟ)/i;
function wkBusy(){return listening||uploading||playing||speakQ.length>0||vmode==='speak'||vmode==='think'||(voice&&voice.phase==='think')||(mr&&mr.state!=='inactive')||Date.now()<WK.cool||!!WK.sess}
function wkUI(){const b=$('wake');b.classList.toggle('off',!WK.on);b.classList.toggle('on',WK.on);b.setAttribute('aria-pressed',WK.on);
 b.setAttribute('aria-label',WK.on?'ปิดโหมดเรียก อีฟ':'เปิดโหมดเรียก อีฟ');b.classList.toggle('hear',!!WK.eng);b.classList.toggle('vad',WK.eng==='vad');b.classList.toggle('err',!!WK.err);
 $('wkL').textContent=!WK.on?'':WK.err?WK.err:WK.sess?'':WK.eng==='sr'?'พูดว่า “อีฟ”':WK.eng==='vad'?'ฟังเสียงพูด':''}
function wkStop(){clearTimeout(WK.rt);WK.rt=null;if(WK.sr){const r=WK.sr;WK.sr=null;try{r.onend=r.onerror=r.onresult=null;r.abort()}catch(e){}}
 cancelAnimationFrame(WK.raf);WK.raf=0;try{WK.src&&WK.src.disconnect()}catch(e){}WK.src=WK.an=null;if(WK.stream){WK.stream.getTracks().forEach(t=>t.stop());WK.stream=null}WK.eng=null;wkUI()}
function wkRetry(){wkStop();if(!WK.on)return;const d=WK.back;WK.back=Math.min(30000,WK.back*2);WK.rt=setTimeout(()=>{WK.rt=null;wkStart()},d)}
function wkStart(){if(!WK.on||WK.eng||WK.rt||document.hidden)return;if(wkBusy())return;WK.err='';
 if(WSR&&!window.EVE_FORCE_VAD){let r;try{r=new WSR();r.lang='th-TH';r.continuous=true;r.interimResults=true;r.maxAlternatives=3}catch(e){return wkVad()}
  WK.sr=r;WK.eng='sr';WK.hit='';WK.hitN=0;
  r.onresult=ev=>{if(wkBusy())return;WK.back=500;
   for(let i=ev.resultIndex;i<ev.results.length;i++){const res=ev.results[i];for(let a=0;a<res.length;a++){const t=String(res[a].transcript||'').toLowerCase(),c=res[a].confidence;
    const m=t.match(WAKE_RE);if(!m)continue;
    if(res.isFinal&&(!c||c>=.45))return wkFire('sr:final');            // final + confident (Chrome reports 0 when unknown)
    if(WK.hit===m[1]){if(++WK.hitN>=2)return wkFire('sr:stable')}else{WK.hit=m[1];WK.hitN=1} // same match in 2 interim events
   }}};
  r.onerror=ev=>{const e=ev&&ev.error;if(e==='not-allowed'||e==='service-not-allowed'){WK.err='ไมค์ไม่ได้รับอนุญาต';wkStop();if(e==='service-not-allowed'&&!window.EVE_FORCE_VAD){window.EVE_FORCE_VAD=1;WK.err='';wkRetry()}return}
   if(e==='network'||e==='audio-capture'){wkRetry();return}};
  r.onend=()=>{if(WK.sr!==r)return;WK.sr=null;WK.eng=null;wkUI();if(!WK.on)return;const d=Math.max(300,WK.back);WK.back=Math.min(30000,WK.back*2);WK.rt=setTimeout(()=>{WK.rt=null;wkStart()},d)}; // auto-restart, backoff resets on results
  try{r.start()}catch(e){WK.sr=null;WK.eng=null;return wkRetry()}wkUI();return}
 wkVad()}
function wkVad(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){WK.err='ไม่รองรับไมโครโฟน';wkUI();return}
 WK.eng='vad';wkUI();
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(st=>{
  if(WK.eng!=='vad'||!WK.on){st.getTracks().forEach(t=>t.stop());return}
  WK.stream=st;const AC=window.AudioContext||window.webkitAudioContext;actx=actx||new AC();actx.resume&&actx.resume();
  WK.src=actx.createMediaStreamSource(st);WK.an=actx.createAnalyser();WK.an.fftSize=512;WK.buf=new Uint8Array(512);WK.src.connect(WK.an);
  let floor=.012,sp=0,last=performance.now(),t0=last;
  const loop=()=>{if(WK.eng!=='vad')return;const now=performance.now(),dt=Math.min(100,now-last);last=now;
   if(wkBusy()){wkStop();return}
   WK.an.getByteTimeDomainData(WK.buf);let r=0;for(let i=0;i<WK.buf.length;i++){const d=(WK.buf[i]-128)/128;r+=d*d}r=Math.sqrt(r/WK.buf.length);
   const thr=Math.max(.035,floor*3.5);
   if(now-t0<1500){floor=floor*.9+r*.1}                          // calibrate on start
   else if(r>thr){sp+=dt;if(sp>=600)return wkFire('vad')}           // >=0.6s sustained speech
   else{sp=Math.max(0,sp-dt*2);floor=floor*.985+r*.015}           // adaptive road-noise floor
   WK.raf=requestAnimationFrame(loop)};WK.raf=requestAnimationFrame(loop);WK.back=500;
 }).catch(err=>{WK.eng=null;if(err&&err.name==='NotAllowedError'){WK.err='ไมค์ไม่ได้รับอนุญาต';wkUI()}else wkRetry()})}
function duckReq(action){return fetch('/api/voice/duck'+KQ,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action})}).then(r=>r.json().catch(()=>({}))).catch(()=>({}))}
function wkFire(why){console.log('[EvE] wake',why);wkStop();if(wkBusy())return;
 const s={at:Date.now(),paused:false,pausing:null,started:false};WK.sess=s;wkUI();
 if(carData&&carData.state==='online'&&carData.media_playing===true)s.pausing=duckReq('pause').then(d=>{s.paused=!!(d&&d.paused);return d});
 lastTap=0;startMic().then(ok=>{s.started=!!ok;if(!ok)wkEnd('mic failed')})}
function wkEnd(why){const s=WK.sess;if(!s)return;WK.sess=null;WK.cool=Date.now()+3000;console.log('[EvE] wake session end',why);
 (s.pausing||Promise.resolve()).then(()=>{if(s.paused)duckReq('resume')});wkUI();setTimeout(wkStart,3100)}
setInterval(()=>{const s=WK.sess;
 if(s){const idle=!listening&&!uploading&&!playing&&!speakQ.length&&vmode!=='speak'&&vmode!=='think'&&!(voice&&voice.phase==='think')&&!(mr&&mr.state!=='inactive');
  if(Date.now()-s.at>120000)return wkEnd('timeout');
  if(idle&&Date.now()-s.at>2500)return wkEnd(voice&&voice.phase==='err'?'error/cancel':'reply done');return}
 if(WK.on&&!WK.eng&&!WK.rt&&!wkBusy())wkStart();
 if(WK.eng==='sr'&&wkBusy())wkStop()},500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)wkStop()});
$('wake').addEventListener('click',e=>{e.stopPropagation();unlock();WK.on=!WK.on;LS('eveWake',WK.on?'1':null);WK.back=500;WK.err='';if(WK.on)wkStart();else{wkStop();if(WK.sess)wkEnd('off')}wkUI()});
wkUI();if(WK.on)setTimeout(wkStart,1200);
window.EVE={sendSay,startMic,stopMic,say,debugListen:on=>{on===false?(setVoice(null),setV('')):setVoice({phase:'listen',text:''})},wake:()=>({on:WK.on,engine:WK.eng,session:WK.sess,hasSR:!!WSR}),state:()=>({speakQ:speakQ.length,playing,audioOK,listening,vmode,usedFallback,voice})};
// resume a pending utterance after a reload: keep thinking until its deadline and catch up on missed replies
try{const p=JSON.parse(LS('evePending')||'null');if(p&&p.until>Date.now()+1000)setVoice({phase:'think',text:p.text||'',started:p.started,until:p.until,sub:'กำลังรอคำตอบจาก EvE'});else LS('evePending',null)}catch(e){LS('evePending',null)}
tick();setInterval(tick,15000);startSSE();
